[package]
name = "rivers-lineage"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "OpenLineage emission for rivers runs, steps and assets"
keywords.workspace = true
rust-version.workspace = true

[dependencies]
anyhow.workspace = true
arrow-ipc = "59"
arrow-schema = "59"
async-trait = "0.1"
jiff.workspace = true
openlineage-client = { version = "0.0.5", default-features = false }
reqwest = { workspace = true, features = ["rustls", "json"] }
rivers-core = { path = "../rivers-core" }
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["time", "macros"] }
tokio-util.workspace = true
tracing.workspace = true
url.workspace = true
uuid = { workspace = true, features = ["v5"] }

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "net", "io-util"] }
